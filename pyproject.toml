[project]
name = "aoi-normalizer"
version = "0.1.0"
description = "Continuously normalize Holly AOI XML exports into CSV files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
aoi-normalizer = "aoi_normalizer.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", ".runtime", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
